name: Deploy homepage to server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-homepage
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static website
        # Mapbox 公开 Token 必须在构建时注入，静态文件发布后不能再读取服务器环境变量。
        env:
          NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}
        run: |
          pnpm build
          test -f out/index.html
          tar -czf site.tar.gz -C out .

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Upload and publish
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -O \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -P "$DEPLOY_PORT" \
            site.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/usr/share/nginx/html/echo/releases/$GITHUB_SHA.tar.gz"

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail

          revision="$1"
          base=/usr/share/nginx/html/echo
          release="$base/releases/$revision"

          mkdir -p "$release"
          tar -xzf "$base/releases/$revision.tar.gz" -C "$release"
          test -f "$release/index.html"

          chmod -R u=rwX,go=rX "$release"

          ln -sfn "$release" "$base/current.next"
          mv -Tf "$base/current.next" "$base/current"
          REMOTE

# 推送 main
#   → GitHub 创建临时 Ubuntu 构建机器
#   → 下载代码
#   → 安装 Node.js、pnpm 和项目依赖
#   → 注入 Mapbox Token 并构建
#   → 打包网页
#   → SSH 上传服务器
#   → 切换到新版本